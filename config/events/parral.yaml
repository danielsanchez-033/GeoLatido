events:
  - id: parral-tormenta-2026-07-01
    title: Tormenta en Hidalgo del Parral
    type: heavy_rain
    phenomena: [flood]
    date: "2026-07-01"
    # Horas de los incidentes del boletín (hora local UTC−6): no son el inicio ni el fin de la lluvia.
    time_utc: "21:37"
    verdicts_event_type: urban_storm
    location: Hidalgo del Parral, Chihuahua
    # La fuente no da coordenadas de cada incidente: la geometría es la caja de la ciudad (config/aois/parral.yaml).
    bbox: [-105.75, 26.87, -105.60, 26.98]
    geometry_precision: city
    description: >-
      Protección Civil del Estado registró 22,8 mm de lluvia acumulada en una hora; un vehículo arrastrado en el
      Arroyo de las Quintas (15:37 hora local), un deslave en el Perimetral Norte (16:27) y una lámpara en riesgo de
      caer (17:00). Sin personas lesionadas.
    confidence: official
    sources:
      - name: Coordinación Estatal de Protección Civil (Gobierno del Estado de Chihuahua)
        url: https://www.chihuahua.gob.mx/index.php/prensa/registra-parral-228-milimetros-de-lluvia-en-el-lapso-de-una-hora
        published: "2026-07-01"
        checked_on: "2026-11-12"
      - name: El Tiempo de Parral
        url: https://www.tiempo.com.mx/local/en-una-hora-llovio-228-mm-y-parral-sufrio-por-inundaciones-noticias-chihuahua/
        published: "2026-07-01"
        checked_on: "2026-11-12"
    unknown:
      - Cuánto tiempo estuvo el agua en la calle.
      - Estación y método de la medida de lluvia.
