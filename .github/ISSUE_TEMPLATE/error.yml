name: Error
description: Algo no funciona como dice la especificación
title: "fix: "
body:
  - type: dropdown
    id: rol
    attributes:
      label: Rol afectado
      options: [Antena, Eco, Balanza, Atlas, Faro, No lo sé]
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducirlo
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: Qué esperabas y qué pasó
    validations:
      required: true
  - type: dropdown
    id: veracidad
    attributes:
      label: ¿Afecta a la veracidad de lo que se muestra?
      options: ["No", "Sí: muestra algo que el dato no sostiene", "No lo sé"]
    validations:
      required: true
