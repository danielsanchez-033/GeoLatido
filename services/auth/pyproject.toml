[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "nisar-auth"
version = "0.1.0"
description = "Cuentas, sesiones y tokens JWT de los perfiles de la API de veredictos."
license = "Apache-2.0"
requires-python = ">=3.10"
# Licencias comprobadas en PyPI el 2026-11-14: PyJWT MIT, cryptography Apache-2.0 o BSD-3-Clause,
# argon2-cffi y argon2-cffi-bindings MIT, cffi MIT-0, pycparser BSD-3-Clause. Todas compatibles con Apache-2.0.
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "pyjwt>=2.8,<3",
  "cryptography>=42",
  "argon2-cffi>=23,<26",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
