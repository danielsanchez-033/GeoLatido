[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "nisar-ingest"
version = "0.1.0"
description = "Trae por HTTPS solo el recorte de una zona desde los gránulos GCOV de NASA."
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
  "h5py>=3.11,<4",
  "numpy>=1.26,<3",
  "rasterio>=1.3.10,<2",
  "pyyaml>=6,<7",
  "fsspec>=2024.6",
  "aiohttp>=3.9,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
