# /api/research/ (motor de investigación, 2026-11-15): GET y POST, cuerpo de 16 KB como máximo (una pregunta y
# hasta cuatro áreas). Sin cookie: el comodín de CORS vale. Va en su location; ver read-only.conf para el motivo.
if ($request_method = OPTIONS) {
    return 204;
}
if ($request_method !~ ^(GET|POST)$) {
    return 405;
}
client_max_body_size 16k;
add_header Access-Control-Allow-Origin "*" always;
add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
add_header Access-Control-Allow-Headers "Authorization, Content-Type, *" always;
add_header Access-Control-Expose-Headers "WWW-Authenticate, Retry-After, Content-Disposition" always;
