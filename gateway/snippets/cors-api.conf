# CORS de /api/ y de las teselas: cualquier origen y sin credenciales, porque el token va en una cabecera y no en
# una cookie. El comodín de Allow-Headers no cubre Authorization (norma Fetch), así que se nombra (specs/06-acceso).
# En nginx, un add_header dentro de un location anula todos los del server: quien añada uno incluye este archivo.
add_header Access-Control-Allow-Origin "*" always;
add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
add_header Access-Control-Allow-Headers "Authorization, Content-Type, *" always;
# X-Export-* y Content-Disposition: la exportación de la búsqueda (T-BAL-13) pone ahí la consulta y el nombre.
add_header Access-Control-Expose-Headers "WWW-Authenticate, Retry-After, Content-Disposition, X-Export-Total, X-Export-Query, X-Export-Data-Kinds, X-Export-Generated-At" always;
