# CORS de /api/auth/: la cookie de renovación exige el origen exacto del frontend (AUTH_ALLOWED_ORIGIN) y
# credenciales; el comodín no vale con credenciales (specs/06-acceso, plan).
add_header Access-Control-Allow-Origin $auth_allowed_origin always;
add_header Access-Control-Allow-Credentials "true" always;
add_header Access-Control-Allow-Methods "GET, POST, DELETE, OPTIONS" always;
add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
add_header Access-Control-Expose-Headers "WWW-Authenticate, Retry-After" always;
