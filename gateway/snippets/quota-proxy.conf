# Paso al server interno de cuotas (T-BAL-12, default.conf.template). Un proxy_set_header en el location anula
# todos los del server, así que se repiten aquí las cabeceras de perfil (RF-ACC-05) además de las claves de cuota.
proxy_set_header X-Auth-Role $auth_role;
proxy_set_header X-Auth-Sub $auth_sub;
proxy_set_header X-Quota-Public $quota_public_key;
proxy_set_header X-Quota-Student $quota_student_key;
proxy_set_header X-Quota-Researcher $quota_researcher_key;
proxy_pass http://127.0.0.1:8081;
