# AUTH_ENABLED=0 (por omisión, RF-ACC-10): el gateway no valida tokens y todo es public, como antes de la ola 2.
# Las cabeceras X-Auth-* del cliente se pisan igual; las rutas nuevas responden 403 desde su servicio.
set $auth_role public;
set $auth_sub "";
# Sin cuotas (RF-ACC-10): las rutas nuevas ya responden 403 a todos.
set $quota_mode off;

# La salud del acceso responde 200 y dice que está apagado (2026-11-15): con 503, el navegador apuntaba un error en
# la consola en cada carga solo por preguntar. La interfaz lee `auth_enabled`.
location = /api/auth/health {
    include /etc/nginx/snippets/cors-auth.conf;
    if ($request_method = OPTIONS) {
        return 204;
    }
    default_type application/json;
    return 200 '{"status":"ok","auth_enabled":false,"detail":"El acceso con cuenta está desactivado en esta pila (AUTH_ENABLED=0). Todas las rutas actuales funcionan sin cuenta, como public."}';
}

# Sin validación no se puede abrir sesión: se dice así en lugar de dar tokens que el gateway no miraría.
location /api/auth/ {
    include /etc/nginx/snippets/cors-auth.conf;
    if ($request_method = OPTIONS) {
        return 204;
    }
    default_type application/json;
    return 503 '{"detail":"El acceso con cuenta está desactivado en esta pila (AUTH_ENABLED=0). Todas las rutas actuales funcionan sin cuenta, como public."}';
}
