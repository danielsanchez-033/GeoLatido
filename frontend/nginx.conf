server {
    listen 80;
    root /usr/share/nginx/html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Los assets de Vite llevan hash en el nombre: se pueden cachear sin miedo.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";

        # El worker de MapLibre es .mjs y nginx no lo reconoce; un worker de módulo exige tipo JavaScript.
        location ~ \.mjs$ {
            types { }
            default_type application/javascript;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
    }
}
